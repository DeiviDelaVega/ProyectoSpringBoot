<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Clientes Más Reservadores</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="stylesheet" th:href="@{/css/Reportes.css}" />
</head>
<body>
	<nav th:replace="admin/HeaderNavAdministrador :: nav"></nav>
	<br>

	<h2 style="text-align:center;">👤 Clientes que más han Reservado</h2>
	<br>
	<div style="width: 60%; margin: auto;">
		<canvas id="graficoClientes"></canvas>
	</div>

	<script th:inline="javascript">
		const datos = /*[[${datosClientes}]]*/ [];

		const labels = [];
		const valores = [];

		datos.forEach(d => {
			labels.push(d[1]);
			valores.push(d[2]); 
		});

		new Chart(document.getElementById('graficoClientes'), {
			type: 'bar',
			data: {
				labels: labels,
				datasets: [{
					label: 'Total de Reservas',
					data: valores,
					backgroundColor: 'rgba(75, 192, 192, 0.7)',
					borderColor: 'rgba(75, 192, 192, 1)',
					borderWidth: 1
				}]
			},
			options: {
				responsive: true,
				scales: {
					y: {
						beginAtZero: true,
						title: {
							display: true,
							text: 'Reservas'
						}
					}
				}
			}
		});
	</script>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
