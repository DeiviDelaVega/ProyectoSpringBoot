<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Inmuebles Más Reservados</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="stylesheet" th:href="@{/css/Reportes.css}" />
</head>
<body>
	<nav th:replace="admin/HeaderNavAdministrador :: nav"></nav>
	<br>
	<div class="fade-in">
		<h2 style="text-align:center;">📊 Inmuebles Más Reservados</h2>
		<br>
	    <div style="width: 60%; margin: auto;">
	        <canvas id="graficoInmuebles"></canvas>
	    </div>
	    <br>
	</div>

    <script th:inline="javascript">
        const datos = /*[[${datosInmuebles}]]*/ [];

        const labels = [];
        const valores = [];

        datos.forEach(d => {
            labels.push(d[0]);
            valores.push(d[1]);
        });

        new Chart(document.getElementById('graficoInmuebles'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Cantidad de Reservas',
                    data: valores,
                    backgroundColor: 'rgba(54, 162, 235, 0.7)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Reservas'
                        }
                    }
                }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
