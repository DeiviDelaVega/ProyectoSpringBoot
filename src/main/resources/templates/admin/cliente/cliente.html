<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clientes</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" />
    

    <link rel="stylesheet" th:href="@{/css/Cliente.css}" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
<nav th:replace="admin/HeaderNavAdministrador :: nav"></nav>
<br>

<div class="list-clientes-container container py-4 fade-in">
    <h2 class="section-title mb-3"><strong>Listado de Clientes</strong></h2>

    <br>
    <div class="d-flex mb-3" style="gap: 16px;">
        <button id="toggleFiltrosBtn" class="btn btn-outline-secondary px-4 py-2 fs-6">
            <i class="fa fa-sliders-h me-2"></i> Filtros
        </button>
    </div>

    <div id="filtrosForm" style="display: none;">
        <form th:action="@{/admin/cliente}" method="get" class="filtro-container">
            <div class="form-row">
                <div class="col-md-6 d-flex align-items-center mb-2" style="margin-left: 23px">
                    <label class="control-label mr-2" style="width: 300px;">Apellido o Documento</label>
                    <input type="text" name="filtro" placeholder="Buscar Apellido o Documento"
                           th:value="${filtro}" class="form-control" />
                </div>
            </div>
            <div class="d-flex mt-3" style="margin-left: 23px">
                <button type="submit" class="btn btn-dark">Buscar</button>
                <a href="/admin/cliente" class="btn btn-secondary ms-2" style="margin-left: 8px">Limpiar</a>
            </div>
        </form>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>N.º Documento</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Fecha de Registro</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.idCliente}"></td>
            <td th:text="${cliente.nombre}"></td>
            <td th:text="${cliente.apellido}"></td>
            <td th:text="${cliente.nroDocumento}"></td>
            <td th:text="${cliente.direccion}"></td>
            <td th:text="${cliente.numeroTelf}"></td>
            <td th:text="${cliente.correo}"></td>
            <td th:text="${#temporals.format(cliente.fechaRegistro,'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-nowrap">
                <div class="d-flex gap-2">
                    <a th:href="@{/admin/cliente/detalle/{id}(id=${cliente.idCliente})}" title="Detalle"
                       class="text-decoration-none">
                        <i class="fa fa-magnifying-glass icon-action"></i>
                    </a>
                    <a th:href="@{/admin/cliente/editar/{id}(id=${cliente.idCliente})}" title="Editar"
                       class="text-decoration-none">
                        <i class="fa fa-pen icon-action"></i>
                    </a>
                    <a href="#" th:attr="data-eliminar=${cliente.idCliente}" title="Eliminar"
                       class="text-decoration-none">
                        <i class="fa fa-trash icon-action text-danger"></i>
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:replace="Paginacion :: paginator"></nav>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toggle Filtros con localStorage -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const filtros = document.getElementById("filtrosForm");
        const boton = document.getElementById("toggleFiltrosBtn");

        const visible = localStorage.getItem("filtrosClientesVisible") === "true";
        filtros.style.display = visible ? "block" : "none";

        boton.innerHTML = visible
            ? 'Ocultar Filtros'
            : '<i class="fa fa-sliders-h me-2"></i> Filtros';

        boton.addEventListener("click", function () {
            const currentlyVisible = filtros.style.display === "block";
            filtros.style.display = currentlyVisible ? "none" : "block";
            localStorage.setItem("filtrosClientesVisible", !currentlyVisible);
            boton.innerHTML = !currentlyVisible
                ? 'Ocultar Filtros'
                : '<i class="fa fa-sliders-h me-2"></i> Filtros';
        });
    });
</script>

<!-- Confirmación SweetAlert2 para eliminar -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const enlacesEliminar = document.querySelectorAll("a[data-eliminar]");
        enlacesEliminar.forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const idCliente = this.getAttribute("data-eliminar");
                Swal.fire({
                    title: '¿Estás seguro de eliminar este cliente?',
                    text: 'Esta acción no se puede deshacer',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = '/admin/cliente/eliminar/' + idCliente;
                    }
                });
            });
        });
    });
</script>

<!-- SweetAlerts para actualizado y eliminado -->
<div id="estado-actualizacion" th:if="${actualizado != null}" th:attr="data-actualizado=${actualizado}"></div>
<div id="estado-eliminado" th:if="${eliminado != null}" th:attr="data-eliminado=${eliminado}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const divActualizado = document.getElementById("estado-actualizacion");
        const divEliminado = document.getElementById("estado-eliminado");

        if (divActualizado) {
            const actualizado = divActualizado.getAttribute("data-actualizado") === "true";
            Swal.fire({
                title: actualizado ? '¡Actualizado!' : 'Error',
                text: actualizado
                    ? 'El cliente se actualizó correctamente'
                    : 'No se pudo actualizar el cliente. Intente nuevamente',
                icon: actualizado ? 'success' : 'error',
                confirmButtonText: 'Aceptar'
            });
        }

        if (divEliminado) {
            const eliminado = divEliminado.getAttribute("data-eliminado") === "true";
            Swal.fire({
                title: eliminado ? '¡Eliminado!' : 'Error',
                text: eliminado
                    ? 'El cliente fue eliminado correctamente'
                    : 'No se pudo eliminar el cliente. Intente nuevamente',
                icon: eliminado ? 'success' : 'error',
                confirmButtonText: 'Aceptar'
            });
        }
    });
</script>

</body>
</html>
