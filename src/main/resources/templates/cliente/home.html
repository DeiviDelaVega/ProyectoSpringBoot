<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Inicio Cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/PaginaInicioAdminCliente.css}">
</head>

<body>
	<nav th:replace="cliente/HeaderNavCliente :: nav"></nav>
	<br>
	<br>
	<div class="fade-in">
		<h1 class="text-center">
			Hola <span th:text="${nombreCliente}"></span>
		</h1>
		<h2 class="text-center">
			Bienvenido a la vista de CLIENTE
		</h2>
		<br>
		<div class="banner-container">
			<img src="/imagenes/baner1.jpg" id="baner">
		</div>
		<br>
	</div>


	<!-- Modal de sanción -->
	<div th:if="${modalSancion}" class="modal fade" id="modalSancion" tabindex="-1" aria-labelledby="modalSancionLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content border-warning shadow-lg">
				<div class="modal-header bg-warning bg-gradient text-dark">
					<h5 class="modal-title fw-bold" id="modalSancionLabel">
						<i class="fas fa-triangle-exclamation me-2"></i> Cuenta sancionada
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>
				<div class="modal-body text-center">
					<i class="fas fa-ban fa-5x text-danger mb-3"></i>
					<p class="fs-5 text-danger fw-semibold" th:utext="${alerta}"></p>
				</div>
				<div class="modal-footer justify-content-center">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
						<i class="fas fa-check-circle me-1"></i> Entendido
					</button>
				</div>
			</div>
		</div>
	</div>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:inline="javascript">
		document.addEventListener("DOMContentLoaded", function () {
			let mostrarModal = /*[[${modalSancion}]]*/ false;
			let alerta = /*[[${alerta}]]*/ '';

			if (mostrarModal === true || mostrarModal === 'true') {
				Swal.fire({
					icon: 'warning',
					title: 'Cuenta sancionada',
					text: alerta,
					confirmButtonText: 'Entendido',
					confirmButtonColor: '#d33',
					customClass: {
						popup: 'animated fadeInDown'
					}
				});
			}
		});
	</script>



	<script src="/js/ClienteJs.js"></script>
</body>

</html>
